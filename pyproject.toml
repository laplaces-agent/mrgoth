[project]
name = "mrgoth"
version = "0.0.0"
description = "MR Goth: metric-compatible MS Gothic / MS UI Gothic / MS PGothic (Latin and symbols); build, trace and check tools"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fonttools[ufo]",
    "ufoLib2",
    "ufo2ft",
    "freetype-py",
    "uharfbuzz",
    "skia-pathops",
    "numpy",
    "pillow",
    "typing-extensions>=4.16.0",
    "scipy>=1.18.1",
    "ttfautohint-py>=0.6.1",
]

[tool.uv]
package = false
